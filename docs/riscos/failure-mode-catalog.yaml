version: 1
product: W_Flyer
updated_at: '2026-07-20'
source: ../qa/19-matriz-falhas-pre-mortem.md
policy:
  unknown_failure: fail_closed_when_musical_integrity_authorization_or_artifact_integrity_may_be_at_risk
  new_incident_requires:
  - incident_id
  - new_PM_id
  - minimal_fixture
  - root_cause
  - control_update
  - regression_test
  - documentation_update
  default_auto_publish: false
  activation_requires_all_applicable_entries_evidenced: true
allowed_values:
  severity:
  - low
  - medium
  - high
  - critical
  handling:
  - reject
  - review
  - retry
  - degrade
  - incident
  retry_class:
  - never
  - transient
  - after_user_action
  - after_configuration_change
  status:
  - identified
  - designed
  - implemented
  - evidenced
  - accepted
  - retired
  residual_risk_status:
  - not_assessed
  - open
  - accepted
  - mitigated
  - retired
